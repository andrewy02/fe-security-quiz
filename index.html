<script id="questions-source">
(function (root) {
  const source = (title, url) => ({ title, url });
  const owasp = (slug) => source('OWASP 학습 자료', 'https://cheatsheetseries.owasp.org/cheatsheets/' + slug + '_Cheat_Sheet.html');
  const levels = [
    { id: 'beginner', label: '초급', en: 'FOUNDATIONS', number: '01', description: '보안의 기본 개념부터 차근차근.', topics: ['보안 3요소', '피싱', '인증'], time: '약 3분', questions: [
      { id: 'b1', topic: '보안 3요소', question: '정보보안의 3요소인 CIA에 해당하지 않는 것은?', options: ['기밀성 (Confidentiality)', '무결성 (Integrity)', '가용성 (Availability)', '익명성 (Anonymity)'], answer: 3, explanation: 'CIA는 기밀성·무결성·가용성입니다. 기밀성은 허가된 사람만 정보에 접근하도록 하고, 무결성은 정보의 부적절한 변경을 막으며, 가용성은 필요할 때 정보와 서비스를 사용할 수 있도록 합니다.' },
      { id: 'b2', topic: '피싱 대응', question: '“계정이 곧 정지됩니다”라는 이메일에 로그인 링크가 있습니다. 가장 적절한 행동은?', options: ['링크를 눌러 비밀번호를 입력한다', '공식 앱이나 직접 입력한 공식 주소에서 알림을 확인한다', '발신자 이름이 학교라면 링크를 신뢰한다', '메일에 비밀번호를 답장한다'], answer: 1, explanation: '긴급한 행동을 요구하는 메시지는 피싱일 수 있습니다. 발신자 표시 이름만으로 신뢰하지 말고, 공식 앱이나 직접 입력한 공식 사이트에서 사실을 확인하세요.' },
      { id: 'b3', topic: '다중요소 인증', question: '서로 다른 인증 요소를 사용하는 다중요소 인증(MFA)의 예는?', options: ['비밀번호와 보안 질문', '비밀번호를 두 번 입력하기', '비밀번호와 인증 앱의 일회용 코드', 'PIN과 또 다른 PIN'], answer: 2, explanation: '비밀번호는 “알고 있는 것”, 인증 앱이 있는 기기는 “가지고 있는 것”에 해당합니다. 두 비밀번호나 보안 질문을 조합하는 것은 같은 지식 요소를 반복하는 것입니다.', source: owasp('Multifactor_Authentication') },
      { id: 'b4', topic: '해시와 암호화', question: '해시와 암호화의 차이에 대한 설명으로 가장 적절한 것은?', options: ['해시는 보통 키로 복호화해 원문을 되찾는 방식이 아니다', '해시는 언제나 원문을 그대로 저장한다', '암호화는 키가 있어도 원문 복원이 불가능하다', '모든 해시 함수는 비밀번호 저장에 똑같이 적합하다'], answer: 0, explanation: '암호화는 적절한 키로 복호화할 수 있지만, 해시는 일반적으로 복호화 기능이 없는 단방향 변환입니다. 다만 추측 공격은 가능하므로 비밀번호에는 솔트와 Argon2id 같은 전용 비밀번호 해시를 사용해야 합니다.', source: owasp('Password_Storage') },
      { id: 'b5', topic: '보안 윤리', question: '학교 시스템의 보안 점검을 시작하기 전에 가장 먼저 해야 할 일은?', options: ['인터넷에 결과를 공개한다', '관리자 비밀번호를 추측한다', '친구가 허락하면 학교 서버를 점검한다', '시스템 소유자의 명시적 허가와 점검 범위를 확인한다'], answer: 3, explanation: '보안 점검에는 시스템 소유자의 명시적인 허가가 필요합니다. 대상·기간·허용된 방법·보고 절차 등 합의된 범위 안에서 진행해야 합니다. 학생이라는 사실만으로 점검 권한이 생기지는 않습니다.' }
    ] },
    { id: 'intermediate', label: '중급', en: 'WEB & NETWORK', number: '02', description: '웹과 네트워크의 방어 원리 익히기.', topics: ['SQL 삽입', 'XSS', 'TLS'], time: '약 5분', questions: [
      { id: 'm1', topic: 'SQL 삽입 방어', question: '사용자 입력이 포함된 데이터베이스 조회에서 SQL 삽입을 막는 핵심 방법은?', options: ['작은따옴표만 삭제한다', '입력값을 SQL 문자열 뒤에 붙인다', '매개변수화된 쿼리로 코드와 입력 데이터를 분리한다', '오류 메시지만 숨긴다'], answer: 2, explanation: '매개변수화된 쿼리(준비된 문장)는 SQL 구조를 먼저 정의하고 입력을 데이터로 전달합니다. 문자열 연결이나 특정 문자 삭제만으로는 안전한 방어가 되지 않습니다.', source: owasp('SQL_Injection_Prevention') },
      { id: 'm2', topic: 'XSS 방어', question: '댓글을 일반 텍스트로 표시할 때 XSS를 예방하는 가장 적절한 방식은?', options: ['사용자 문자열을 innerHTML에 바로 넣는다', 'textContent 같은 안전한 출력 방식을 사용한다', '입력 길이만 제한한다', '브라우저 경고를 끈다'], answer: 1, explanation: '일반 텍스트는 textContent처럼 HTML로 해석하지 않는 방식으로 표시해야 합니다. 출력 문맥에 맞는 인코딩이 중요하며, HTML 입력을 꼭 허용해야 한다면 검증된 정화 도구를 사용해야 합니다.', source: owasp('Cross_Site_Scripting_Prevention') },
      { id: 'm3', topic: 'CSRF 방어', question: '쿠키 기반 로그인 서비스에서 송금 요청의 CSRF 위험을 줄이는 적절한 조합은?', options: ['POST 요청이면 무조건 신뢰한다', '버튼을 화면에서 숨긴다', '로그인 쿠키의 유효기간만 늘린다', '서버가 CSRF 토큰을 검증하고 SameSite 쿠키 정책을 적용한다'], answer: 3, explanation: '브라우저는 조건에 따라 쿠키를 자동 전송하므로 공격자가 원치 않는 요청을 유도할 수 있습니다. 서버의 CSRF 토큰 검증과 SameSite 쿠키 정책을 함께 사용하세요. SameSite만으로 모든 상황을 해결할 수는 없습니다.', source: owasp('Cross-Site_Request_Forgery_Prevention') },
      { id: 'm4', topic: 'HTTPS / TLS', question: 'HTTPS에 대한 설명으로 올바른 것은?', options: ['통신을 보호하지만 웹사이트 자체의 모든 취약점을 제거하지는 않는다', 'HTTPS 사이트는 무조건 믿을 수 있는 운영자가 만든다', 'HTTPS를 쓰면 접근 권한 검사가 필요 없다', '서버의 비밀번호가 자동으로 안전하게 저장된다'], answer: 0, explanation: 'TLS는 전송 중 기밀성과 무결성을 보호하고 인증서를 통해 서버 인증을 지원합니다. 그러나 SQL 삽입, XSS, 잘못된 접근 제어 같은 애플리케이션 취약점까지 해결하지는 않습니다.', source: owasp('Transport_Layer_Security') },
      { id: 'm5', topic: '최소 권한', question: '조회만 하는 웹 서비스의 데이터베이스 계정에 적절한 권한은?', options: ['모든 테이블 삭제 권한', '데이터베이스 관리자 권한', '필요한 테이블을 조회하는 최소한의 권한', '다른 서비스의 계정 관리 권한'], answer: 2, explanation: '최소 권한 원칙은 작업에 필요한 권한만 부여하는 것입니다. 조회 서비스에는 필요한 데이터의 조회 권한만 부여하여, 침해가 발생해도 변경·삭제 피해가 커지는 것을 줄입니다.', source: owasp('Database_Security') }
    ] },
    { id: 'advanced', label: '고급', en: 'DEFENSE IN DEPTH', number: '03', description: '상황을 분석하고 더 깊게 방어하기.', topics: ['경쟁 조건', 'SSRF', '접근 제어'], time: '약 7분', questions: [
      { id: 'a1', topic: 'TOCTOU', question: '프로그램이 파일 권한을 검사한 뒤 파일을 열기 전에 다른 프로세스가 파일 대상을 바꿨습니다. 어떤 문제인가요?', options: ['패킷 손실', '검사와 사용 사이의 경쟁 조건 (TOCTOU)', '비밀번호 솔트 충돌', '인증서 만료'], answer: 1, explanation: 'TOCTOU(Time Of Check To Time Of Use)는 검사 시점과 사용 시점 사이에 상태가 변해 발생하는 경쟁 조건입니다. 상황에 맞는 원자적 연산이나 안전한 파일 핸들 사용으로 검사한 대상과 사용하는 대상이 일치하도록 설계해야 합니다.', source: source('MITRE CWE-367', 'https://cwe.mitre.org/data/definitions/367.html') },
      { id: 'a2', topic: 'SSRF 방어', question: '서버가 사용자가 입력한 URL의 이미지를 다운로드합니다. SSRF 방어에 가장 적절한 접근은?', options: ['클라이언트에서만 URL 형식을 검사한다', '주소에 https가 포함되면 모두 허용한다', '응답 이미지의 크기만 제한한다', '허용 대상·실제 연결 IP·리디렉션을 검증하고 내부망 접근을 제한한다'], answer: 3, explanation: '서버가 대신 요청하는 기능은 내부 서비스 접근에 악용될 수 있습니다. 요구사항에 맞는 대상 검증과 네트워크 제한을 적용하고, DNS 해석 결과 및 리디렉션으로 검증이 우회되지 않도록 해야 합니다.', source: owasp('Server_Side_Request_Forgery_Prevention') },

  root.QUIZ_DATA = levels;

<script id="engine-source">
(function (root) {
  function summarize(questions, answers) {
    const correct = questions.filter((q, i) => answers[i] === q.answer).length;
    return { correct, total: questions.length, score: questions.length ? Math.round(correct / questions.length * 100) : 0, wrong: questions.filter((q, i) => answers[i] !== q.answer) };
  }
  root.QuizEngine = { summarize };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.QuizEngine;
})(globalThis);

</script>
<script id="app-source">
(() => {
  'use strict';
  const main = document.getElementById('main');
  let state = null;
  const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const accents = ['var(--green)', 'var(--cyan)', 'var(--purple)'];
  const sourceLink = q => q.source ? `<a href="${esc(q.source.url)}" target="_blank" rel="noopener noreferrer">${esc(q.source.title)} · 새 탭</a>` : '';
  function focusHeading() { main.querySelector('h1')?.focus(); }
  function home(focus = false) {
    state = null;
    main.innerHTML = `<section class="intro"><p class="eyebrow">FE / SECURITY QUIZ</p><h1>보안 지식,<br><em>어디까지 알고 있나요?</em></h1><p>문제를 풀고, 해설로 이해하고, 틀린 개념을 다시 확인하세요.</p><div class="intro-meta"><span><b>3단계</b> 난이도</span><span><b>15문항</b> 보안 개념</span><span><b>4지선다</b> 객관식</span></div></section><div class="section-label"><h2>도전할 난이도를 선택하세요</h2><span>단계별 5문항</span></div><div class="levels">${QUIZ_DATA.map((level, i) => `<article class="level" style="--accent:${accents[i]}"><div class="level-top"><span>${level.en}</span><span class="level-number">${level.number}</span></div><h3>${level.label}</h3><p>${level.description}</p><div class="chips">${level.topics.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div><div class="level-bottom"><span>5문항 · 100점 만점</span><span>${level.time}</span></div><button class="primary" data-level="${level.id}">${level.label} 퀴즈 시작</button></article>`).join('')}</div><p class="note">시간 제한 없이 풉니다. 답을 제출하면 정답과 해설이 표시됩니다.</p>`;
    main.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => start(b.dataset.level)));
    if (focus) { main.querySelector('h1').tabIndex = -1; focusHeading(); }
  }
  function start(levelId, questions) {
    const level = QUIZ_DATA.find(l => l.id === levelId);
    state = { level, questions: questions || [...level.questions], index: 0, answers: [], selected: null, submitted: false, review: !!questions };
    renderQuestion();
  }
  function renderQuestion() {
    const q = state.questions[state.index];
    main.innerHTML = `<div class="quiz-wrap"><div class="work-top"><div class="quiz-meta"><span class="badge">${state.level.label}</span><span>${state.review ? '오답 재도전' : state.level.en}</span></div><button id="exit" class="secondary">난이도 선택</button></div><div id="exit-slot"></div><div class="progress-row"><span>문항 ${state.index + 1} / ${state.questions.length}</span><span id="correct-count">${state.answers.filter((a,i) => a === state.questions[i].answer).length}문항 정답</span></div><progress value="${state.index}" max="${state.questions.length}" aria-label="제출한 문항 수"></progress><section class="question-card"><span class="topic">${esc(q.topic)}</span><h1 tabindex="-1">${esc(q.question)}</h1><fieldset class="options"><legend>정답을 하나 선택하세요</legend>${q.options.map((o,i) => `<label class="option"><input type="radio" name="answer" value="${i}"><span>${esc(o)}</span><span class="answer-flag"></span></label>`).join('')}</fieldset><div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="submit" class="primary" disabled>정답 제출</button><button id="next" class="primary" hidden>${state.index === state.questions.length - 1 ? '결과 보기' : '다음 문항'}</button></div></section><p class="micro">${state.review ? '틀렸던 개념을 다시 확인해 보세요.' : '문항당 20점 · 제출한 답은 변경할 수 없습니다.'}</p></div>`;
    main.querySelectorAll('input[name="answer"]').forEach(input => input.addEventListener('change', () => {
      if (state.submitted) return;
      state.selected = Number(input.value);
      main.querySelectorAll('.option').forEach(l => l.classList.toggle('selected', l.contains(input)));
      document.getElementById('submit').disabled = false;
    }));
    document.getElementById('submit').addEventListener('click', submit);
    document.getElementById('next').addEventListener('click', () => {
      if (!state.submitted) return;
      if (state.index === state.questions.length - 1) return result();
      state.index++; state.selected = null; state.submitted = false; renderQuestion();
    });
    document.getElementById('exit').addEventListener('click', confirmExit);
    focusHeading();
  }
  function submit() {
    if (state.submitted || state.selected === null) return;
    const q = state.questions[state.index];
    state.answers[state.index] = state.selected; state.submitted = true;
    const correct = state.selected === q.answer;
    main.querySelectorAll('.option').forEach((label,i) => {
      label.querySelector('input').disabled = true;
      if (i === q.answer) { label.classList.add('correct'); label.querySelector('.answer-flag').textContent = '정답'; }
      else if (i === state.selected) { label.classList.add('wrong'); label.querySelector('.answer-flag').textContent = '내 선택'; }
    });
    document.getElementById('feedback').innerHTML = `<div class="feedback ${correct ? '' : 'incorrect'}"><h2>${correct ? '정답입니다!' : '다시 기억해 두세요.'}</h2><p>${esc(q.explanation)}</p>${sourceLink(q)}</div>`;
    document.getElementById('correct-count').textContent = `${state.answers.filter((a,i) => a === state.questions[i].answer).length}문항 정답`;
    main.querySelector('progress').value = state.index + 1;
    document.getElementById('submit').hidden = true;
    document.getElementById('next').hidden = false;
    document.getElementById('next').focus();
  }
  function confirmExit() {
    const slot = document.getElementById('exit-slot');
    if (slot.firstChild) return;
    slot.innerHTML = '<div class="exit-panel" role="group" aria-label="퀴즈 종료 확인"><p>난이도 선택으로 돌아가면 현재 풀이 기록이 사라집니다.</p><button id="continue" class="primary">계속 풀기</button><button id="leave" class="secondary">돌아가기</button></div>';
    document.getElementById('continue').addEventListener('click', () => { slot.innerHTML = ''; document.getElementById('exit').focus(); });
    document.getElementById('leave').addEventListener('click', () => home(true));
    document.getElementById('continue').focus();
  }
  function result() {
    const report = QuizEngine.summarize(state.questions, state.answers);
    const message = report.score === 100 ? '모든 문항을 맞혔어요. 다음 단계에도 도전해 보세요.' : report.score >= 60 ? '잘 풀었어요. 헷갈린 개념을 해설로 정리해 보세요.' : '한 걸음씩 익히면 됩니다. 해설을 읽고 다시 도전해 보세요.';
    const levelIndex = QUIZ_DATA.findIndex(l => l.id === state.level.id);
    main.innerHTML = `<div class="quiz-wrap"><section class="result"><p class="eyebrow">${state.level.label} / ${state.review ? '오답 재도전' : 'QUIZ COMPLETE'}</p><h1 tabindex="-1">${report.score === 100 ? '완벽하게 이해했어요!' : '오늘의 보안 점검 완료'}</h1><div class="score-ring"><strong>${report.score}<span>점</span></strong><span>100점 만점</span></div><p>${report.total}문항 중 ${report.correct}문항 정답 · 정답률 ${report.score}%</p><p>${message}</p><div class="actions">${report.wrong.length ? '<button id="retry-wrong" class="primary">오답만 다시 풀기</button>' : levelIndex < 2 ? '<button id="next-level" class="primary">다음 난이도 도전</button>' : ''}<button id="restart" class="secondary">같은 단계 다시 풀기</button><button id="home" class="secondary">난이도 선택</button></div></section><h2 class="review-heading">문항별 정답과 해설</h2>${state.questions.map((q,i) => `<details class="review-card ${state.answers[i] === q.answer ? '' : 'incorrect'}" ${state.answers[i] !== q.answer ? 'open' : ''}><summary><span>${state.answers[i] === q.answer ? '정답' : '오답'} · ${esc(q.topic)}</span>${i+1}. ${esc(q.question)}</summary><div class="review-content"><p>내 선택: ${esc(q.options[state.answers[i]])}</p><p class="right-answer">정답: ${esc(q.options[q.answer])}</p><p class="explanation">${esc(q.explanation)}</p>${sourceLink(q)}</div></details>`).join('')}</div>`;
    const levelId = state.level.id;
    document.getElementById('retry-wrong')?.addEventListener('click', () => start(levelId, report.wrong));
    document.getElementById('next-level')?.addEventListener('click', () => start(QUIZ_DATA[levelIndex+1].id));
    document.getElementById('restart').addEventListener('click', () => start(levelId));
    document.getElementById('home').addEventListener('click', () => home(true));
    focusHeading();
  }
  home();
})();

</script>
